name: App checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Test attendance, reports, and update protection
        run: npm test
      - name: Test staff permissions and API access
        run: node tests/access-check.mjs
      - name: Build application
        run: npm run build
      - name: Preserve the built application
        uses: actions/upload-artifact@v4
        with:
          name: satonowa-build
          path: dist/
          include-hidden-files: true
          retention-days: 7
